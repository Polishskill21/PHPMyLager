services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: phpmylager_app_prod
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-https://phpmylager.com}
      # APP_KEY is REQUIRED. Generate once with:
      #   docker run --rm php:8.4-fpm-alpine php -r "echo 'base64:'.base64_encode(random_bytes(32)).PHP_EOL;"
      # and store it in your server's .env file as APP_KEY=base64:...
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SEEDER_PASSWORD: ${SEEDER_PASSWORD}
      WAIT_FOR_DB: "true"
    volumes:
      - prod_public:/var/www/html/public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - phpmylager_net

  web:
    image: nginx:1.27-alpine
    container_name: phpmylager_web_prod
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - prod_public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - phpmylager_net

  db:
    image: mariadb:lts
    container_name: warehouse_db_prod
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - db_data_prod:/var/lib/mysql
    networks:
      - phpmylager_net

networks:
  phpmylager_net:
    driver: bridge

volumes:
  db_data_prod:
  prod_public: